name: CD — Build & Publish Container Image

# Triggered on semantic version tags (v0.1.0, v1.2.3, etc.) so every
# release automatically lands a versioned image in GHCR.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (defaults to git tag)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: northsea-agentops/api

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag with the git semver tag (e.g. v0.1.0 → 0.1.0)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Always keep a 'latest' on tagged releases
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

  deploy-staging:
    name: Update staging deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    # Gate: only deploy staging automatically on release tags.
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch K8s image tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading 'v'
          sed -i "s|ghcr.io/northsea-agentops/api:latest|ghcr.io/northsea-agentops/api:${TAG}|g" \
            infra/k8s/deployment.yaml
          echo "Patched deployment.yaml to image tag: ${TAG}"

      - name: Apply to staging cluster
        # Replace with your preferred deployment mechanism:
        # kubectl apply, helm upgrade, ArgoCD sync, etc.
        run: |
          echo "Deployment step — wire kubectl / helm / ArgoCD here."
          echo "Patched manifest:"
          grep 'image:' infra/k8s/deployment.yaml
