name: Eval Gate — RAGAS Quality Check

on:
  # Run on PRs to main and on scheduled basis
  pull_request:
    branches: [main]
    paths:
      - "src/rag/**"
      - "src/agents/**"
      - "scripts/generate_volve*.py"
      - "scripts/sync_real_volve_daily_rag.py"
      - "data/docs/**"
      - "eval/**"
  schedule:
    # Run daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of test cases to run (default: all 40)"
        required: false
        default: "10"
      faithfulness_threshold:
        description: "Faithfulness threshold (default: 0.80)"
        required: false
        default: "0.80"

env:
  PYTHON_VERSION: "3.11"
  FAITHFULNESS_THRESHOLD: ${{ github.event.inputs.faithfulness_threshold || '0.80' }}
  EVAL_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '10' }}

jobs:
  ragas-eval:
    name: RAGAS Evaluation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: northsea
          POSTGRES_PASSWORD: northsea_eval
          POSTGRES_DB: northsea_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Initialise database
        env:
          PGPASSWORD: northsea_eval
        run: |
          psql -h localhost -U northsea -d northsea_eval -f infra/sql/init.sql

      - name: Real Volve RAG + golden reload (needs workbook under data/Volve_Data/)
        env:
          DATABASE_URL: "postgresql+psycopg://northsea:northsea_eval@localhost:5432/northsea_eval"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MLFLOW_TRACKING_URI: "sqlite:///mlflow_eval.db"
        run: |
          set -euo pipefail
          XLSX='data/Volve_Data/Volve production data.xlsx'
          if [[ ! -f "$XLSX" ]]; then
            echo "::error::Missing $XLSX — CI cannot run VOLVE-aligned RAGAS. Add workbook to checkout or populate via authenticated download step."
            exit 1
          fi
          python scripts/sync_real_volve_daily_rag.py

      - name: Run RAGAS evaluation
        env:
          DATABASE_URL: "postgresql+psycopg://northsea:northsea_eval@localhost:5432/northsea_eval"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MLFLOW_TRACKING_URI: "sqlite:///mlflow_eval.db"
        run: |
          python -m eval.ragas_eval \
            --threshold ${{ env.FAITHFULNESS_THRESHOLD }} \
            --sample ${{ env.EVAL_SAMPLE_SIZE }} \
            --fail-on-threshold

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-results-${{ github.sha }}
          path: eval/results/

      - name: Comment on PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'eval/results/ragas_results.json';
            if (!fs.existsSync(resultsPath)) {
              console.log('No results file found');
              return;
            }
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            const faithfulness = results.faithfulness?.toFixed(4) || 'N/A';
            const relevancy = results.answer_relevancy?.toFixed(4) || 'N/A';
            const precision = results.context_precision?.toFixed(4) || 'N/A';
            const recall = results.context_recall?.toFixed(4) || 'N/A';
            const threshold = '${{ env.FAITHFULNESS_THRESHOLD }}';
            const passed = parseFloat(faithfulness) >= parseFloat(threshold);

            const body = `## RAGAS Evaluation Results

| Metric | Score | Threshold |
|--------|-------|-----------|
| Faithfulness | ${faithfulness} | ${threshold} ${passed ? '✅' : '❌'} |
| Answer Relevancy | ${relevancy} | - |
| Context Precision | ${precision} | - |
| Context Recall | ${recall} | - |

**Test cases:** ${results.num_test_cases || 'N/A'}
**Avg source coverage:** ${results.avg_source_coverage?.toFixed(4) || 'N/A'}
**Weak evidence rate:** ${results.weak_evidence_rate?.toFixed(4) || 'N/A'}`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
