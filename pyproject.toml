[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northsea-agentops"
version = "0.1.0"
description = "Production-grade agentic AI system for offshore oil & gas operations"
requires-python = ">=3.11"
dependencies = [
    # Agent framework
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "langchain-postgres>=0.0.12",

    # LLM & embeddings
    "openai>=1.40.0",
    "tiktoken>=0.7.0",

    # API backend
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Database
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pgvector>=0.3.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    # Kafka / streaming
    "confluent-kafka>=2.5.0",
    "aiokafka>=0.11.0",

    # Data & ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",

    # Observability
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # Evaluation
    "ragas>=0.1.19",
    "mlflow>=2.16.0",
    "dvc>=3.50.0",
    "datasets>=3.0.0",

    # Document processing
    "pypdf>=5.0.0",
    "unstructured>=0.15.0",
    "rank-bm25>=0.2.2",

    # Safety / security
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.8.0",
    "typer>=0.12.0",
    "arrow>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "factory-boy>=3.3.0",
]

[project.scripts]
agentops = "src.cli:app"
ingest = "src.rag.ingestion:main"
generate-data = "src.data.synthetic_generator:main"
run-eval = "eval.ragas_eval:main"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T20", "ARG", "PTH"]
ignore = ["ANN101", "ANN102", "ANN401", "S101", "COM812"]

[tool.ruff.per-file-ignores]
"tests/**" = ["ANN", "S", "ARG"]
"eval/**" = ["ANN", "T20"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=70"

[tool.hatch.build.targets.wheel]
packages = ["src"]
